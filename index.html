<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-title" content="水平儀">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>氣泡水平儀</title>
<style>
  :root {
    --bg: #111418;
    --panel: #1b2027;
    --text: #e8ecf1;
    --muted: #8a94a3;
    --accent: #3fb8af;
    --ok: #4cd964;
    --warn: #ffcc00;
    --bad: #ff5b4f;
    --vial: #2a3a2a;
    --bubble: #c8f56a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    gap: 14px;
  }
  header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .mode-tag { font-size: 13px; color: var(--muted); background: var(--panel); padding: 4px 10px; border-radius: 999px; }

  /* 讀數區 */
  .readout { width: 100%; max-width: 480px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .cell { background: var(--panel); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .cell .lbl { font-size: 12px; color: var(--muted); }
  .cell .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .cell.main .val { color: var(--accent); }
  .level .val { color: var(--ok) !important; }

  /* 圓形氣泡 (平放模式) */
  .stage { flex: 1; width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .circle {
    position: relative; width: min(82vw, 52vh, 380px); aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #33452f 0%, var(--vial) 70%, #1d281d 100%);
    border: 3px solid #4a5a4a; box-shadow: inset 0 0 30px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .ring { position: absolute; left: 50%; top: 50%; border: 1.5px solid rgba(255,255,255,.35); border-radius: 50%; transform: translate(-50%,-50%); }
  .cross-h, .cross-v { position: absolute; background: rgba(255,255,255,.18); }
  .cross-h { left: 0; right: 0; top: 50%; height: 1px; }
  .cross-v { top: 0; bottom: 0; left: 50%; width: 1px; }
  .bubble {
    position: absolute; left: 50%; top: 50%;
    width: 18%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f6ffd8 0%, var(--bubble) 45%, #8fbf2f 100%);
    box-shadow: 0 0 12px rgba(200,245,106,.55);
    transform: translate(-50%,-50%);
    will-change: transform;
  }
  .bubble.level { box-shadow: 0 0 22px 6px rgba(76,217,100,.8); }

  /* 長條氣泡 (立起模式) */
  .edge { display: none; flex-direction: column; align-items: center; gap: 24px; width: 100%; }
  .vial-bar {
    position: relative; width: min(86vw, 400px); height: 64px; border-radius: 32px;
    background: linear-gradient(180deg, #3a4d36, var(--vial) 60%, #1d281d);
    border: 3px solid #4a5a4a; box-shadow: inset 0 0 18px rgba(0,0,0,.6); overflow: hidden;
  }
  .vial-bar .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.45); }
  .vial-bar .bubble-bar {
    position: absolute; top: 50%; left: 50%; width: 22%; height: 70%; border-radius: 999px;
    background: radial-gradient(ellipse at 40% 30%, #f6ffd8 0%, var(--bubble) 50%, #8fbf2f 100%);
    transform: translate(-50%,-50%); will-change: transform;
  }
  .vial-bar .bubble-bar.level { box-shadow: 0 0 20px 5px rgba(76,217,100,.8); }
  .dial { position: relative; width: min(60vw, 240px); aspect-ratio: 1; border-radius: 50%; border: 2px solid #3a4250; }
  .dial .needle { position: absolute; left: 50%; top: 50%; width: 92%; height: 3px; background: var(--accent); border-radius: 2px; transform: translate(-50%,-50%); will-change: transform; }
  .dial .ref { position: absolute; left: 4%; right: 4%; top: 50%; height: 1px; background: rgba(255,255,255,.25); }
  .dial .ref.v { left: 50%; right: auto; top: 4%; bottom: 4%; width: 1px; height: auto; }

  /* 按鈕 */
  .controls { width: 100%; max-width: 480px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  button {
    font: inherit; font-size: 16px; font-weight: 600; color: var(--text);
    background: var(--panel); border: 1px solid #2c333d; border-radius: 14px;
    padding: 16px 8px; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: #062421; border-color: transparent; }
  button.on { background: var(--warn); color: #2a2200; border-color: transparent; }
  .status { font-size: 12px; color: var(--muted); text-align: center; min-height: 1.2em; max-width: 480px; }

  /* 啟動遮罩 */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,12,15,.96); z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center;
  }
  .overlay p { color: var(--muted); line-height: 1.6; margin: 0; max-width: 340px; }
  .overlay button { padding: 16px 40px; font-size: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <h1 style="font-size:24px">氣泡水平儀</h1>
  <p>需要使用手機的方向感測器。<br>iPhone 會跳出權限詢問，請按「允許」。</p>
  <button class="primary" id="startBtn">開始量測</button>
  <p id="overlayMsg" style="color:var(--bad)"></p>
</div>

<header>
  <h1>氣泡水平儀</h1>
  <span class="mode-tag" id="modeTag">平放模式</span>
</header>

<div class="readout">
  <div class="cell" id="cellA"><div class="lbl" id="lblA">X 傾斜</div><div class="val" id="valA">0.0°</div></div>
  <div class="cell main" id="cellMain"><div class="lbl" id="lblMain">總傾角</div><div class="val" id="valMain">0.0°</div></div>
  <div class="cell" id="cellB"><div class="lbl" id="lblB">Y 傾斜</div><div class="val" id="valB">0.0°</div></div>
</div>

<div class="stage">
  <!-- 平放模式 -->
  <div class="circle" id="flatView">
    <div class="cross-h"></div><div class="cross-v"></div>
    <div class="ring" style="width:24%;height:24%"></div>
    <div class="ring" style="width:56%;height:56%"></div>
    <div class="bubble" id="bubble"></div>
  </div>
  <!-- 立起模式 -->
  <div class="edge" id="edgeView">
    <div class="vial-bar">
      <div class="mark" style="left:calc(50% - 14%)"></div>
      <div class="mark" style="left:calc(50% + 14%)"></div>
      <div class="bubble-bar" id="bubbleBar"></div>
    </div>
    <div class="dial">
      <div class="ref"></div><div class="ref v"></div>
      <div class="needle" id="needle"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="primary" id="zeroBtn">歸零</button>
  <button id="holdBtn">鎖定讀數</button>
  <button id="resetBtn">取消歸零</button>
</div>
<div class="status" id="status"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const DEG = 180 / Math.PI, RAD = Math.PI / 180;

  // ===== 設定 =====
  const SMOOTH = 0.15;        // 低通濾波係數 (越小越穩、反應越慢)
  const FLAT_RANGE = 15;      // 圓形氣泡滿刻度角度 (度)
  const EDGE_RANGE = 10;      // 長條氣泡滿刻度角度 (度)
  const LEVEL_TOL = 0.3;      // 視為水平的容許角度 (度)
  const STORE_KEY = 'bubble-level-offset-v1';

  // ===== 狀態 =====
  let up = null;              // 濾波後的「上方向」向量 (螢幕座標)
  let hold = false;
  let mode = 'flat';          // 'flat' 平放 / 'edge' 立起
  let current = { x: 0, y: 0, edge: 0 };   // 未扣除歸零值的原始角度
  let offset = loadOffset();
  let wasLevel = false;
  let gotEvent = false;

  function loadOffset() {
    try {
      const o = JSON.parse(localStorage.getItem(STORE_KEY));
      if (o && typeof o.x === 'number') return o;
    } catch (e) {}
    return { x: 0, y: 0, edge: 0 };
  }
  function saveOffset() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(offset)); } catch (e) {}
  }

  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    if (typeof window.orientation === 'number') return window.orientation;
    return 0;
  }

  // 由 beta/gamma 算出裝置座標系中的「上方向」單位向量，再轉到螢幕座標
  function onOrientation(e) {
    if (e.beta == null || e.gamma == null) return;
    gotEvent = true;
    const b = e.beta * RAD, g = e.gamma * RAD;
    const dx = -Math.sin(g) * Math.cos(b);
    const dy = Math.sin(b);
    const dz = Math.cos(b) * Math.cos(g);

    // 依螢幕旋轉角補償，讓氣泡方向永遠對應畫面
    const a = screenAngle() * RAD;
    const v = {
      x: dx * Math.cos(a) - dy * Math.sin(a),
      y: dx * Math.sin(a) + dy * Math.cos(a),
      z: dz
    };

    if (!up) up = v;
    else {
      up.x += (v.x - up.x) * SMOOTH;
      up.y += (v.y - up.y) * SMOOTH;
      up.z += (v.z - up.z) * SMOOTH;
    }
  }

  function wrap180(d) { return ((d + 180) % 360 + 360) % 360 - 180; }

  function fmt(d) {
    const v = Math.abs(d) < 0.05 ? 0 : d;
    return v.toFixed(1) + '°';
  }

  function render() {
    requestAnimationFrame(render);
    if (!up || hold) return;

    const n = Math.hypot(up.x, up.y, up.z) || 1;
    const ux = up.x / n, uy = up.y / n, uz = up.z / n;

    // 自動判斷模式：螢幕傾角 < 約 50° 為平放，否則為立起
    // (含遲滯，避免在臨界角來回跳)
    if (mode === 'flat' && Math.abs(uz) < Math.cos(55 * RAD)) mode = 'edge';
    else if (mode === 'edge' && Math.abs(uz) > Math.cos(45 * RAD)) mode = 'flat';

    const sz = uz >= 0 ? 1 : -1;  // 螢幕朝下時仍可使用
    current.x = Math.atan2(ux, sz * uz) * DEG;   // 左右傾斜 (右側高為正)
    current.y = Math.atan2(uy, sz * uz) * DEG;   // 前後傾斜 (上緣高為正)
    current.edge = Math.atan2(ux, uy) * DEG;     // 螢幕平面內旋轉角 (直立為 0)

    if (mode === 'flat') renderFlat(); else renderEdge();
  }

  function renderFlat() {
    $('flatView').classList.remove('hidden');
    $('edgeView').style.display = 'none';
    $('modeTag').textContent = '平放模式';
    $('lblA').textContent = 'X 左右';
    $('lblB').textContent = 'Y 前後';
    $('lblMain').textContent = '總傾角';

    const x = current.x - offset.x;
    const y = current.y - offset.y;
    const total = Math.hypot(x, y);   // 小角度近似

    $('valA').textContent = fmt(x);
    $('valB').textContent = fmt(y);
    $('valMain').textContent = fmt(total);

    // 氣泡位置 (往高的一側跑)
    const r = Math.min(total / FLAT_RANGE, 1);
    const ang = Math.atan2(y, x);
    const maxPx = $('flatView').clientWidth * 0.41;
    const px = Math.cos(ang) * r * maxPx;
    const py = -Math.sin(ang) * r * maxPx;
    const bubble = $('bubble');
    bubble.style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;

    setLevel(total <= LEVEL_TOL, [bubble], ['cellMain', 'cellA', 'cellB']);
  }

  function renderEdge() {
    $('flatView').classList.add('hidden');
    $('edgeView').style.display = 'flex';
    $('modeTag').textContent = '立起模式';
    $('lblA').textContent = '偏差';
    $('lblB').textContent = '絕對角';
    $('lblMain').textContent = '水平 / 垂直';

    const raw = wrap180(current.edge - offset.edge);
    // 以最接近的 0/90/180/270° 為基準，算出偏差
    const snap = Math.round(raw / 90) * 90;
    const dev = raw - snap;

    $('valA').textContent = fmt(dev);
    $('valB').textContent = fmt(raw);
    $('valMain').textContent = fmt(Math.abs(dev));

    // 長條氣泡：偏差為正時氣泡往右
    const bar = $('bubbleBar');
    const r = Math.max(-1, Math.min(1, dev / EDGE_RANGE));
    const maxPx = bar.parentElement.clientWidth * 0.38;
    bar.style.transform = `translate(calc(-50% + ${r * maxPx}px), -50%)`;

    // 指針保持水平 (相對世界)
    $('needle').style.transform = `translate(-50%,-50%) rotate(${raw}deg)`;

    setLevel(Math.abs(dev) <= LEVEL_TOL, [bar], ['cellMain', 'cellA']);
    $('cellB').classList.remove('level');
  }

  function setLevel(isLevel, els, cells) {
    els.forEach(el => el.classList.toggle('level', isLevel));
    ['cellMain', 'cellA', 'cellB'].forEach(id => $(id).classList.toggle('level', isLevel && cells.includes(id)));
    if (isLevel && !wasLevel && navigator.vibrate) navigator.vibrate(30);
    wasLevel = isLevel;
  }

  // ===== 按鈕 =====
  $('zeroBtn').onclick = () => {
    if (!up) return flash('尚未取得感測器資料');
    if (mode === 'flat') { offset.x = current.x; offset.y = current.y; }
    else { offset.edge = current.edge - Math.round(current.edge / 90) * 90; }
    saveOffset();
    flash(mode === 'flat' ? '已將目前平放角度設為 0°' : '已將目前立起角度設為基準');
  };
  $('resetBtn').onclick = () => {
    offset = { x: 0, y: 0, edge: 0 };
    saveOffset();
    flash('已清除歸零值，回到感測器原始讀數');
  };
  $('holdBtn').onclick = () => {
    hold = !hold;
    $('holdBtn').classList.toggle('on', hold);
    $('holdBtn').textContent = hold ? '解除鎖定' : '鎖定讀數';
    flash(hold ? '讀數已鎖定' : '');
  };

  let flashTimer;
  function flash(msg) {
    $('status').textContent = msg;
    clearTimeout(flashTimer);
    if (msg) flashTimer = setTimeout(() => $('status').textContent = offsetText(), 2500);
  }
  function offsetText() {
    const has = offset.x || offset.y || offset.edge;
    return has ? `歸零值：X ${offset.x.toFixed(1)}°　Y ${offset.y.toFixed(1)}°　立起 ${offset.edge.toFixed(1)}°` : '未設定歸零（使用感測器原始讀數）';
  }

  // ===== 螢幕常亮 =====
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
  });

  // ===== 啟動 =====
  $('startBtn').onclick = async () => {
    if (!window.isSecureContext) {
      $('overlayMsg').textContent = '感測器需要 HTTPS 連線才能使用，請透過 https:// 網址開啟。';
      return;
    }
    if (!('DeviceOrientationEvent' in window)) {
      $('overlayMsg').textContent = '此瀏覽器不支援方向感測器。';
      return;
    }
    try {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        const res = await DeviceOrientationEvent.requestPermission();   // iOS 13+
        if (res !== 'granted') {
          $('overlayMsg').textContent = '未取得感測器權限。請到 設定 > Safari 允許「動作與方向取用」後重新整理。';
          return;
        }
      }
    } catch (e) {
      $('overlayMsg').textContent = '權限要求失敗：' + e.message;
      return;
    }
    window.addEventListener('deviceorientation', onOrientation);
    $('overlay').classList.add('hidden');
    $('status').textContent = offsetText();
    keepAwake();
    requestAnimationFrame(render);
    setTimeout(() => {
      if (!gotEvent) $('status').textContent = '未收到感測器資料（電腦或不支援的裝置無法使用）';
    }, 1500);
  };
})();
</script>
</body>
</html>
